name: Cora e Firebase - Validacao integrada
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/finance-integration.yml']
permissions:
  contents: read
jobs:
  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Firestore SDK
        run: python -m pip install 'google-cloud-firestore>=2.19,<3'
      - name: Consultar extratos e boletos sem publicar dados
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CORA_ENV: production
          CORA_CLIENT_ID: ${{ secrets.CORA_CLIENT_ID }}
          CORA_CERTIFICATE: ${{ secrets.CORA_CERTIFICATE }}
          CORA_PRIVATE_KEY: ${{ secrets.CORA_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          test -n "$CORA_CLIENT_ID" && test -n "$CORA_CERTIFICATE" && test -n "$CORA_PRIVATE_KEY" || { echo "Secrets ausentes"; exit 1; }
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          printf '%s\n' "$CORA_CERTIFICATE" > "$tempdir/cert.pem"
          printf '%s\n' "$CORA_PRIVATE_KEY" > "$tempdir/key.pem"
          export CORA_CERT_PATH="$tempdir/cert.pem"
          export CORA_KEY_PATH="$tempdir/key.pem"
          unset CORA_CERTIFICATE CORA_PRIVATE_KEY
          python - <<'PY'
          from cora_client import CoraClient
          from urllib.error import HTTPError
          try:
              token = CoraClient()._access_token()
              if not isinstance(token, str) or not token:
                  raise ValueError("Invalid token")
              print("Autenticacao PRODUCAO bem-sucedida.")
          except HTTPError as exc:
              print("Falha HTTP:", exc.code)
              import json
              try:
                  body = json.loads(exc.read(16384))
                  code = body.get("error") if isinstance(body, dict) else None
                  allowed = {"invalid_client", "invalid_request", "invalid_grant", "unauthorized_client", "unsupported_grant_type", "invalid_scope", "access_denied", "server_error"}
                  print("Categoria OAuth:", code if isinstance(code, str) and code in allowed else "nao identificada")
              except Exception:
                  print("Resposta sem categoria OAuth reconhecida")
              raise SystemExit(1) from None
          except Exception as exc:
              print("Falha de autenticacao:", type(exc).__name__)
              raise SystemExit(1) from None
          from datetime import date
          from zoneinfo import ZoneInfo
          from datetime import datetime
          today = datetime.now(ZoneInfo("America/Fortaleza")).date()
          start = today.replace(day=1).isoformat()
          end = today.isoformat()
          client = CoraClient()
          failed = False
          for label, query in (("Extratos", client.statement), ("Boletos", client.invoices)):
              try:
                  result = query(start, end)
                  if not isinstance(result, (dict, list)):
                      raise ValueError("Unexpected response")
                  print(label + ": consulta GET bem-sucedida; resposta JSON recebida.")
                  # Only allowlisted schema labels, never values or arbitrary keys.
                  allowed = {"items","data","content","invoices","transactions","entries","statement","total","totalPages","page","size","hasNext","next","id","status","amount","value","date","due_date","dueDate","created_at","paid_at","payment","customer","balance","type","description","direction","pagination"}
                  def shape(obj, depth=0):
                      if depth > 3:
                          return type(obj).__name__
                      if isinstance(obj, dict):
                          return {k: shape(v, depth+1) for k,v in obj.items() if k in allowed}
                      if isinstance(obj, list):
                          return {"kind":"list","count":len(obj),"sample_schema":shape(obj[0],depth+1) if obj else None}
                      return type(obj).__name__
                  import json
                  print(label + " schema: " + json.dumps(shape(result), ensure_ascii=True))
              except HTTPError as exc:
                  print(label + ": HTTP", exc.code)
                  failed = True
              except Exception as exc:
                  print(label + ": falha", type(exc).__name__)
                  failed = True
          if failed:
              raise SystemExit(1)
          from finance_pagination import collect_pages
          try:
              entries = collect_pages(client.statement, start, end, "entries", 50)
              invoices = collect_pages(client.invoices, start, end, "items", 20)
              print("Paginacao validada: movimentacoes =", len(entries), "; boletos =", len(invoices))
              from finance_classification import summarize_invoices
              counts = summarize_invoices(invoices, today)
              # Inspect field names and types only; no amounts, identifiers or payer data.
              monetary_fields = {"amount","value","total_amount","totalAmount","original_amount","originalAmount","paid_amount","paidAmount","payment_amount","paymentAmount","amount_paid","amountPaid","total","services","payments","payment","invoice","currency","balance"}
              def monetary_schema(obj, depth=0):
                  if depth > 4:
                      return None
                  if isinstance(obj, dict):
                      return {k: monetary_schema(v, depth+1) for k,v in obj.items() if k in monetary_fields}
                  if isinstance(obj, list):
                      return [monetary_schema(obj[0],depth+1)] if obj else []
                  return type(obj).__name__
              import json
              schemas = {json.dumps(monetary_schema(row),sort_keys=True) for row in invoices}
              print("Campos monetarios boletos:", sorted(schemas))
              if invoices:
                  detail = client.invoice_details(invoices[0]["id"])
                  # Inspect only fixed cadastral field names and types, never personal values.
                  cadastral = {"customer","payer","name","document","cpf","cnpj","email","phone","telephone","address","street","number","district","city","state","zip_code","postal_code","contact","contacts","tax_id","identity","document_number"}
                  def cadastral_shape(obj, depth=0):
                      if depth > 5: return None
                      if isinstance(obj, dict): return {k:cadastral_shape(v,depth+1) for k,v in obj.items() if k in cadastral}
                      if isinstance(obj,list): return [cadastral_shape(obj[0],depth+1)] if obj else []
                      return type(obj).__name__
                  print("Estrutura cadastral lista:", json.dumps(cadastral_shape(invoices[0]),sort_keys=True))
                  print("Estrutura cadastral detalhe:", json.dumps(cadastral_shape(detail),sort_keys=True))
                  print("Campos monetarios detalhe:", json.dumps(monetary_schema(detail),sort_keys=True))
              print("Classificacao de boletos: desconhecidos =", counts["unclassified"])
              # Only recognized enum values are logged, never arbitrary bank text.
              allowed_types = {"CREDIT","DEBIT","IN","OUT","INCOME","EXPENSE","PIX","TRANSFER","PAYMENT","BOLETO","REFUND"}
              types = {str(row.get("type","")).upper() for row in entries}
              print("Tipos reconhecidos:", sorted(types & allowed_types))
              print("Tipos nao reconhecidos:", len(types - allowed_types))
              if counts["unclassified"]:
                  raise ValueError("Unmapped invoice status")
          except Exception as exc:
              print("Paginacao interrompida:", type(exc).__name__)
              raise SystemExit(1) from None
          try:
              import os, json
              from google.oauth2 import service_account
              from google.cloud import firestore
              info = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
              if info.get("project_id") != "vinnas-del-mar-finance":
                  raise ValueError("Wrong project")
              db = firestore.Client(project="vinnas-del-mar-finance", credentials=service_account.Credentials.from_service_account_info(info))
              db.collection("integration_checks").document("cora_connectivity").set({
                  "checkedAt": firestore.SERVER_TIMESTAMP,
                  "statementQuery": True,
                  "invoiceQuery": True,
                  "financialImport": False,
                  "paginationValidated": True
              })
              # Publish only aggregate counts, never payer data or raw bank records.
              period = today.strftime("%Y-%m")
              payload = {
                  "period": period,
                  "coverageStart": start,
                  "coverageEnd": end,
                  "invoiceCounts": dict(counts, total=len(invoices)),
                  "updatedAt": firestore.SERVER_TIMESTAMP,
                  "scope": "invoice_query_period",
                  "monetaryDataAvailable": False
              }
              batch = db.batch()
              batch.set(db.collection("finance_admin").document(period), payload, merge=True)
              batch.set(db.collection("finance_public").document(period), payload, merge=True)
              batch.commit()
              print("Firebase: totais de boletos publicados nas colecoes protegidas.")
          except Exception as exc:
              print("Firebase: falha", type(exc).__name__)
              raise SystemExit(1) from None
          PY

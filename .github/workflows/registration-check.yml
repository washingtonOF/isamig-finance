name: Registration validation
on:
  workflow_dispatch:
  push:
    paths:
      - registration_validation.py
      - test_registration_validation.py
      - .github/workflows/registration-check.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_registration_validation

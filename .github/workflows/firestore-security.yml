name: Firestore security checks
on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/firestore-isolation.mjs'
      - '.github/workflows/firestore-security.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --ignore-scripts firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.12.0
      - name: Run local emulator tests
        run: |
          printf '%s' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > firebase.security-test.json
          npx --no-install firebase emulators:exec --config firebase.security-test.json --project demo-vinnas --only firestore "node tests/firestore-isolation.mjs"

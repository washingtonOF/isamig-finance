name: Credential exposure checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and history for private keys
        shell: bash
        run: |
          pattern='-----BEGIN (RSA |EC |ENCRYPTED |OPENSSH |DSA )?PRIVATE KEY-----'
          if git log --all --format='%h' -G "$pattern" -- . | grep -q .; then
            echo 'Potential private key in repository history. Investigate and rotate affected credentials.'
            exit 1
          fi
          if git ls-files | grep -Ei '(^|/)(\.env(\..*)?|[^/]*\.(pem|key|p12|pfx|jks|keystore)|[^/]*cert_key[^/]*\.zip)$' | grep -vE '(^|/)\.env\.example$' | grep -q .; then
            echo 'Potential credential file tracked. Review repository privately.'
            exit 1
          fi

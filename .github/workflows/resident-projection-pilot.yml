name: Resident projection - verified units
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/resident-projection-pilot.yml']
permissions:
  contents: read
concurrency:
  group: resident-projection-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'firebase-admin>=6,<8'
      - run: python -m unittest -v test_resident_invoice_projection
      - name: Publish verified own-unit projections
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CORA_ENV: production
          CORA_CLIENT_ID: ${{ secrets.CORA_CLIENT_ID }}
          CORA_CERTIFICATE: ${{ secrets.CORA_CERTIFICATE }}
          CORA_PRIVATE_KEY: ${{ secrets.CORA_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          printf '%s\n' "$CORA_CERTIFICATE" > "$tempdir/cert.pem"
          printf '%s\n' "$CORA_PRIVATE_KEY" > "$tempdir/key.pem"
          export CORA_CERT_PATH="$tempdir/cert.pem"
          export CORA_KEY_PATH="$tempdir/key.pem"
          unset CORA_CERTIFICATE CORA_PRIVATE_KEY
          python - <<'PY'
          import os,json
          import firebase_admin
          from firebase_admin import credentials,auth,firestore
          from resident_projection_sync import sync_authorized_residents
          from datetime import datetime
          from zoneinfo import ZoneInfo
          try:
              info=json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
              if info.get("project_id")!="vinnas-del-mar-finance":
                  raise ValueError("Wrong project")
              firebase_admin.initialize_app(credentials.Certificate(info))
              month=datetime.now(ZoneInfo("America/Fortaleza")).strftime("%Y-%m")
              sync_authorized_residents(firestore.client(),auth,month)
              print("Projection rollout finished; review per-unit results.")
          except Exception as exc:
              print("Pilot blocked:",type(exc).__name__)
              raise SystemExit(1) from None
          PY


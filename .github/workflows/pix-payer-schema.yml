name: Pix payer schema inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pix-payer-schema.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORA_ENV: production
      CORA_CLIENT_ID: ${{ secrets.CORA_CLIENT_ID }}
      CORA_CERTIFICATE: ${{ secrets.CORA_CERTIFICATE }}
      CORA_PRIVATE_KEY: ${{ secrets.CORA_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install 'google-cloud-firestore>=2.19,<3'
      - run: |
          set -eu
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$CORA_CERTIFICATE" > "$d/cert"
          printf '%s\n' "$CORA_PRIVATE_KEY" > "$d/key"
          export CORA_CERT_PATH="$d/cert" CORA_KEY_PATH="$d/key"
          python - <<'PY'
          from cora_client import CoraClient
          from finance_pagination import collect_pages
          import json
          allowed=set("id type transaction description amount createdAt payer sender origin originator counterparty counterParty identity source destination receiver recipient name fullName full_name payerName senderName document taxId cpf cnpj account bank institution details payment pix endToEndId endToEnd transactionId person customer debtor creditor owner holder accountHolder".split())
          def shape(obj,depth=0):
              if depth>6: return "nested"
              if isinstance(obj,dict):
                  return {k:shape(v,depth+1) for k,v in obj.items() if k in allowed}
              if isinstance(obj,list): return [shape(obj[0],depth+1)] if obj else []
              return type(obj).__name__
          try:
              rows=collect_pages(CoraClient().statement,"2026-11-03","2026-11-03","entries",50)
              matches=[r for r in rows if str(r.get("type","")).upper()=="CREDIT" and str(r.get("transaction",{}).get("type","")).upper()=="PIX" and r.get("amount")==25000]
              print("Candidate count:",len(matches))
              print("Named counterpart count:",sum(isinstance(r["transaction"].get("counterParty"),dict) and bool(r["transaction"]["counterParty"].get("name")) for r in matches))
              import unicodedata
              def is_fatima(r):
                  p=r["transaction"].get("counterParty") or {}
                  name=p.get("name") if isinstance(p,dict) else None
                  return isinstance(name,str) and "fatima" in "".join(c for c in unicodedata.normalize("NFD",name.lower()) if not unicodedata.combining(c)).split()
              print("Fatima name token matches:",sum(is_fatima(r) for r in matches))
              print("Allowed field schemas:",json.dumps(sorted({json.dumps(shape(r),sort_keys=True) for r in matches})))
          except Exception as exc:
              print("Inspection blocked:",type(exc).__name__)
              raise SystemExit(1) from None
          PY

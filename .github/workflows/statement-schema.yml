name: Statement schema validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/statement-schema.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CORA_ENV: production
      CORA_CLIENT_ID: ${{ secrets.CORA_CLIENT_ID }}
      CORA_CERTIFICATE: ${{ secrets.CORA_CERTIFICATE }}
      CORA_PRIVATE_KEY: ${{ secrets.CORA_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install 'google-cloud-firestore>=2.19,<3'
      - run: |
          set -eu
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$CORA_CERTIFICATE" > "$d/cert"
          printf '%s\n' "$CORA_PRIVATE_KEY" > "$d/key"
          export CORA_CERT_PATH="$d/cert" CORA_KEY_PATH="$d/key"
          python - <<'PY'
          from cora_client import CoraClient
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from collections import Counter
          import json
          today=datetime.now(ZoneInfo("America/Fortaleza")).date()
          try:
              data=CoraClient().statement(today.replace(day=1).isoformat(),today.isoformat())
              rows=data["entries"]
              allowed={"id","date","created_at","transaction_date","description","amount","value","balance","type","direction","entry_type","transaction_type","status","name","category","transaction","credit","debit","currency","total","opening_balance","closing_balance","current_balance","available_balance","entries","counterparty","payment","details"}
              def shape(v,depth=0):
                  if depth>4: return type(v).__name__
                  if isinstance(v,dict): return {k:shape(x,depth+1) for k,x in v.items() if k in allowed}
                  if isinstance(v,list): return [shape(v[0],depth+1)] if v else []
                  return type(v).__name__
              print("Response schema:",json.dumps(shape(data),sort_keys=True))
              known_keys={"date","created_at","createdAt","occurred_at","occurredAt","timestamp","entry_date","entryDate","transaction_date","transactionDate","posted_at","postedAt","booking_date","bookingDate","datetime","created","updated_at","balance","balance_after","balanceAfter","account_balance","accountBalance","availableBalance","currentBalance","initialBalance","finalBalance","initial_balance","final_balance","start_balance","end_balance","total_balance","totalBalance","amount","type","transaction","id","entries","total","pagination","description","category","name"}
              def keys(obj):
                  return sorted(k for k in obj if k in known_keys)
              print("Root keys:",keys(data),"other count:",len(set(data)-known_keys))
              print("Entry keys:",keys(rows[0]),"other count:",len(set(rows[0])-known_keys))
              print("Transaction keys:",keys(rows[0]["transaction"]))
              print("Amount signs:",dict(Counter((r["type"]+("_negative" if r["amount"]<0 else "_nonnegative")) for r in rows if r["type"] in ("CREDIT","DEBIT"))))
              print("Entry schemas:",json.dumps(sorted({json.dumps(shape(r),sort_keys=True) for r in rows})))
              for k in ("type","direction","entry_type","transaction_type"):
                  known={"CREDIT","DEBIT","IN","OUT","INCOME","EXPENSE","PIX","TRANSFER","PAYMENT","BOLETO","REFUND"}
                  print(k,dict(Counter(str(r.get(k)).upper() if str(r.get(k)).upper() in known else "OTHER" for r in rows)))
          except Exception as exc:
              print("Schema check blocked:",type(exc).__name__)
              raise SystemExit(1) from None
          import os
          from finance_pagination import collect_pages
          entries=collect_pages(CoraClient().statement,today.replace(day=1).isoformat(),today.isoformat(),"entries",50)
          known={"BOLETO","PIX","TRANSFER","PAYMENT","INVOICE","BANK_SLIP","INTERNAL_TRANSFER","REFUND","CASH_IN","CASH_OUT","BILLET","INVOICE_PAYMENT","PIX_IN","PIX_OUT","BANK_SLIP_PAYMENT"}
          groups=Counter()
          for row in entries:
              t=str(row['transaction'].get('type','')).upper()
              groups[(row['type'],t if t in known else 'OTHER')]+=row['amount']
          print('Movement reconciliation:',dict(groups))
          from google.oauth2 import service_account
          from google.cloud import firestore
          from statement_sync import sync_statement
          try:
              info=json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
              if info.get("project_id")!="vinnas-del-mar-finance": raise ValueError("Wrong project")
              db=firestore.Client(project=info["project_id"],credentials=service_account.Credentials.from_service_account_info(info))
              sync_statement(db,CoraClient())
          except Exception as exc:
              print("Statement sync blocked:",type(exc).__name__)
              raise SystemExit(1) from None
          PY
